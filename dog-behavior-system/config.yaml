# Central config: which adapters to use, zone geometry, thresholds.
# Swap any "adapters.*" value to point at real hardware tomorrow -- see README "Hardware plug-in points".

subject_id: demo_dog_01

# Shown on the dashboard and used by Claude's daily summary.
dog:
  name: "Coco"
  breed: "Golden Retriever"
  age: "3 years"
  daily_activity_goal_min: 60   # active minutes (walking + running + exploring) per day

digest:
  min_interval_s: 90    # the Claude "today" check-in refreshes at most this often (if new events)

# Zones as normalized [x0, y0, x1, y1] rects over the camera frame (0..1, origin top-left).
# The dog's zone = whichever rect contains the bbox-centre; "unknown" if none match.
# Tune these at the venue by eyeballing the webcam frame.
# Off by default: zones only make sense once the rects match a fixed, mounted camera.
zones_enabled: false
zones:
  door_area: [0.0, 0.0, 0.35, 0.55]
  bed_area: [0.65, 0.0, 1.0, 0.55]
  food_area: [0.0, 0.55, 0.35, 1.0]
  play_area: [0.35, 0.55, 1.0, 1.0]

adapters:
  # VideoSource: webcam index ("0"), a file path, or an rtsp/http URL (phone IP-cam).
  video_source: "0"
  video_fps_sample: 8      # frames/s sent to YOLO (detection)
  display_fps: 0           # dashboard stream cap; 0 = every frame at the source's native fps
  loop_video_files: true   # replay demo clips in a loop
  # AudioSource: "mic" for sounddevice input, or a wav/mp4 file path. null disables audio.
  audio_source: null
  # Output sinks to enable, in order. Options: console, device_state, serial, webhook
  output_sinks: ["console", "device_state"]
  serial_port: null       # e.g. /dev/tty.usbserial-XXXX for a real ESP32 mirror
  webhook_url: null

thresholds:
  gait:
    # bbox-centre speed in bbox-heights/second
    stationary_max: 0.6
    walking_max: 2.2
    trotting_max: 4.5
    # above trotting_max => galloping
  vision_labeler:
    interval_s: 2.0      # one Claude vision call per this many seconds while a dog is visible
    strip_frames: 4      # dog crops per call (lets Claude judge gait and mouth movement)
    strip_span_s: 1.2    # time span the crops cover
    vote_over: 3         # label = confidence-weighted vote over the last N Claude answers
    max_age_s: 6.0       # after this, fall back to heuristics until a new Claude label arrives
  audio:
    window_s: 1.0
    hop_s: 0.5
    prob_threshold: 0.15
    bark_ast_labels: ["Bark", "Bow-wow", "Yip", "Dog"]
    whine_ast_labels: ["Whimper (dog)", "Whimper", "Howl"]
  segmenter:
    stable_window_s: 1.0
    max_segment_s: 5.0   # long behaviours are posted every N s so the timeline stays live

# PawPatrol collar (../paw-patrol). Read from the files its receiver writes -- see app/io/collar.py.
collar:
  our_dog_mic_min: 15       # collar mic peak at a laptop-heard bark: >= this -> "our dog"
  not_our_dog_mic_max: 8    # <= this -> "probably not our dog" (doesn't count towards bark alerts)
  gait:                     # after calibration; starting points from COLLAR_DATA.md -- tune on the dog
    still_mag_std: 0.02
    still_gyro_dps: 5.0
    moving_mag_std: 0.03    # below this = fidgeting, not travelling
    walk_max_cadence: 2.0   # Hz; walking below, trotting above
    trot_max_cadence: 3.0   # Hz; galloping above (or any peak over gallop_mag_max)
    gallop_mag_max: 2.0     # g (calibrated)

server:
  host: "0.0.0.0"
  port: 8000

triage:
  min_interval_s: 15
  window_s: 60

llm:
  model_env_var: "CLAUDE_MODEL"
  default_model: "claude-haiku-4-5"
